# Security scans required by the RouteMe Secure Software Development Policy (section 4, Test phase).
# - SAST: Semgrep (p/default rules)
# - Dependencies: OSV-Scanner (lockfiles and manifests)
# - Secrets: gitleaks (full git history, findings redacted)
# Reports are kept as workflow artifacts for 90 days. Scans are report-only for now; they become
# blocking for High/Critical findings once the first results are triaged (Jira KAN-361).

name: Security scan

on:
  pull_request:
  push:
    branches: [prod, production, main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.180.0
      - name: Run Semgrep
        run: |
          semgrep scan --config p/default --metrics=off \
            --json-output=semgrep.json --text-output=semgrep.txt || true
      - name: Summarize
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          r = json.load(open('semgrep.json')).get('results', [])
          c = collections.Counter(x['extra'].get('severity', 'UNKNOWN') for x in r)
          print('### Semgrep (SAST)')
          print(f'Findings: {len(r)} ' + ', '.join(f'{k}: {v}' for k, v in sorted(c.items())))
          EOF
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: semgrep-report
          path: semgrep.*
          retention-days: 90

  dependencies:
    name: Dependency scan (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/
      - name: Run OSV-Scanner
        run: |
          osv-scanner scan source -r --format json --output osv.json . || true
          osv-scanner scan source -r --format table --output osv.txt . || true
      - name: Summarize
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print('### OSV-Scanner (dependencies)')
          if not os.path.exists('osv.json') or os.path.getsize('osv.json') == 0:
              print('No supported lockfiles or manifests found.')
          else:
              d = json.load(open('osv.json'))
              vulns = {v['id'] for res in d.get('results', []) for p in res.get('packages', []) for v in p.get('vulnerabilities', [])}
              pkgs = sum(1 for res in d.get('results', []) for p in res.get('packages', []))
              print(f'Vulnerable packages: {pkgs}, unique advisories: {len(vulns)}')
          EOF
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: osv-report
          path: osv.*
          retention-days: 90

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks (redacted)
        run: gitleaks git --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json .
      - name: Summarize
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          r = json.load(open('gitleaks.json'))
          c = collections.Counter(x.get('RuleID', 'unknown') for x in r)
          print('### gitleaks (secrets, full history, redacted)')
          print(f'Findings: {len(r)} ' + ', '.join(f'{k}: {v}' for k, v in c.most_common()))
          EOF
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.json
          retention-days: 90
